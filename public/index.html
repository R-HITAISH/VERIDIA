<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Veridia — Autonomous Diligence</title>
    <style>
      :root {
        --bg: #0b0f1a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --ok: #34d399;
        --warn: #fbbf24;
        --err: #f87171;
        --border: #1f2937;
      }
      * { box-sizing: border-box; }
      html, body { background: var(--bg); color: var(--text); margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
      header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
      h1 { font-size: 22px; letter-spacing: 4px; margin: 0; }
      h1 span { color: var(--accent); }
      .tag { font-size: 11px; color: var(--muted); letter-spacing: 2px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
      .card h2 { font-size: 13px; letter-spacing: 2px; color: var(--muted); margin: 0 0 12px; font-weight: 600; text-transform: uppercase; }
      input, button, textarea {
        background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 9px 11px; font-size: 14px; width: 100%;
      }
      button {
        background: var(--accent); color: #06121a; font-weight: 700; cursor: pointer;
        border: none; margin-top: 8px;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      label { font-size: 11px; color: var(--muted); display: block; margin-top: 10px; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
      .pill.queued     { background: #1e3a5f; color: #93c5fd; }
      .pill.planning   { background: #3b2f5f; color: #c4b5fd; }
      .pill.investigating { background: #1a3e36; color: #6ee7b7; }
      .pill.synthesizing { background: #4c2a14; color: #fdba74; }
      .pill.reporting  { background: #3f1f5c; color: #d8b4fe; }
      .pill.done       { background: #14532d; color: #86efac; }
      .pill.failed     { background: #5c1a1a; color: #fca5a5; }
      .event { display: grid; grid-template-columns: 86px 130px 1fr; gap: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
      .event .ts { color: var(--muted); }
      .event .kind { color: var(--accent); }
      .event.error .kind { color: var(--err); }
      .empty { color: var(--muted); font-style: italic; }
      .stack { display: flex; flex-direction: column; gap: 4px; }
      a { color: var(--accent); }
      .reportRow { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .runId { font-family: ui-monospace, monospace; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>VERI<span>DIA</span></h1>
        <div class="tag">AUTONOMOUS · MULTI-AGENT · END-TO-END</div>
      </header>

      <div class="grid">
        <section class="card">
          <h2>Trigger Diligence</h2>
          <label>Company</label>
          <input id="company" placeholder="Apple Inc." />
          <div class="row">
            <div>
              <label>Ticker (optional)</label>
              <input id="ticker" placeholder="AAPL" />
            </div>
            <div>
              <label>Source</label>
              <select id="source" style="width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:14px;">
                <option value="manual">manual</option>
                <option value="sec-edgar">sec-edgar webhook</option>
                <option value="news">news webhook</option>
              </select>
            </div>
          </div>
          <label>Thesis hint (optional)</label>
          <textarea id="thesis" rows="3" placeholder="Does the company's hardware moat justify a re-rating?"></textarea>
          <button id="fire">Fire Diligence Run</button>
          <div id="runHandle" style="margin-top:12px;"></div>
        </section>

        <section class="card">
          <h2>Run Status</h2>
          <div id="statusBlock" class="empty">No run selected.</div>
        </section>
      </div>

      <section class="card" style="margin-top:18px;">
        <h2>Live Agent Events</h2>
        <div id="events"><div class="empty">Events stream here once a run is dispatched.</div></div>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let currentRunId = null;
      let evtSource = null;

      async function fire() {
        const company = $("company").value.trim();
        if (!company) return alert("Company required");
        const ticker = $("ticker").value.trim() || undefined;
        const thesis = $("thesis").value.trim() || undefined;
        const source = $("source").value;
        const btn = $("fire");
        btn.disabled = true; btn.textContent = "Dispatching...";

        let url = "/trigger";
        if (source === "sec-edgar") url = "/webhooks/sec-edgar";
        if (source === "news") url = "/webhooks/news";

        const res = await fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ company, ticker, thesis }),
        });
        const data = await res.json();
        btn.disabled = false; btn.textContent = "Fire Diligence Run";
        if (data.runId) attachRun(data.runId);
        else alert(JSON.stringify(data));
      }

      function attachRun(runId) {
        currentRunId = runId;
        $("runHandle").innerHTML = `<span class="runId">Run: ${runId}</span>`;
        $("events").innerHTML = "";
        if (evtSource) evtSource.close();
        evtSource = new EventSource(`/runs/${runId}/stream`);
        evtSource.onmessage = (e) => {
          const ev = JSON.parse(e.data);
          const row = document.createElement("div");
          row.className = "event" + (ev.kind === "agent.error" ? " error" : "");
          const t = new Date(ev.ts).toISOString().slice(11, 19);
          row.innerHTML = `<span class="ts">${t}</span><span class="kind">${ev.kind}</span><span>${escapeHtml(ev.message)}</span>`;
          const e0 = $("events");
          if (e0.firstChild && e0.firstChild.className === "empty") e0.innerHTML = "";
          e0.appendChild(row);
          refreshStatus();
        };
        refreshStatus();
      }

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
      }

      async function refreshStatus() {
        if (!currentRunId) return;
        const r = await fetch(`/runs/${currentRunId}`);
        if (!r.ok) return;
        const run = await r.json();
        const s = run.status || "queued";
        let html = `<div class="stack">
          <div><span class="pill ${s}">${s}</span></div>
          <div class="runId">company: ${escapeHtml(run.trigger?.company ?? "—")} · ticker: ${escapeHtml(run.trigger?.ticker ?? "—")}</div>`;
        if (run.synthesis) {
          html += `<div style="margin-top:8px;"><b>${escapeHtml(run.synthesis.verdict)}</b> · conviction ${(run.synthesis.conviction*100).toFixed(0)}%</div>`;
          html += `<div style="color:var(--muted);font-size:13px;">${escapeHtml(run.synthesis.headline ?? "")}</div>`;
        }
        if (run.reportPath) {
          html += `<div class="reportRow"><a href="/reports/${currentRunId}.pdf" target="_blank">📄 Open PDF memo</a>`;
          if (run.slackDelivered === "1") html += `<span class="pill done">slack ✓</span>`;
          html += `</div>`;
        }
        html += `</div>`;
        $("statusBlock").innerHTML = html;
      }

      $("fire").addEventListener("click", fire);
      setInterval(refreshStatus, 2500);
    </script>
  </body>
</html>
